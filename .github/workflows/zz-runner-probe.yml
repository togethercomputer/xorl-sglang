name: zz-runner-probe

# TEMPORARY. Diagnostic only, delete before merge.
#
# Runs on the xorl-sglang H100 scale set and reports EVERY environment gap in one
# job, instead of the one-per-image-rebuild loop: each rebuild+deploy+rerun cycle
# costs ~15 minutes and surfaces exactly one missing tool, because the install
# script exits at its first failure.
#
# Nothing here fails the job -- every check is `|| true` and prints its own verdict,
# so a single run enumerates all of them.
# push, not workflow_dispatch: dispatch requires the workflow to exist on the default
# branch, and main is the XoRL line -- this diagnostic has no business there.
on:
  push:
    branches: ['xorl/ci-h100-dev']
    paths: ['.github/workflows/zz-runner-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: xorl-sglang-1-h100-gpu-runner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tools on PATH
        run: |
          for c in python3 pip uv cargo rustup protoc cmake ninja git curl wget jq \
                   unzip tar dpkg apt-get sudo nvidia-smi ldconfig numactl ibv_devinfo; do
            printf '  %-12s %s\n' "$c" "$(command -v $c 2>/dev/null || echo MISSING)"
          done

      - name: Environment that gates package installs
        run: |
          for v in PIP_BREAK_SYSTEM_PACKAGES UV_BREAK_SYSTEM_PACKAGES UV_SYSTEM_PYTHON \
                   USE_VENV CUDA_HOME VIRTUAL_ENV; do
            printf '  %-30s %s\n' "$v" "${!v:-<unset>}"
          done
          echo "  python3: $(python3 -V 2>&1)"
          echo "  EXTERNALLY-MANAGED: $(ls /usr/lib/python3.12/EXTERNALLY-MANAGED 2>/dev/null || echo absent)"
          echo "  sudoers.d mode: $(stat -c '%a %U' /etc/sudoers.d 2>/dev/null)"

      - name: Can each installer actually install?
        run: |
          echo "-- sudo --"; sudo -n true 2>&1 && echo "  sudo OK" || echo "  sudo FAILS"
          echo "-- pip system install --"
          python3 -m pip install --dry-run --no-input packaging 2>&1 | tail -2 || true
          echo "-- uv system install --"
          uv pip install --system --dry-run packaging 2>&1 | tail -3 || true
          echo "-- uv venv install --"
          uv venv /tmp/probe-venv >/dev/null 2>&1 && VIRTUAL_ENV=/tmp/probe-venv uv pip install --dry-run packaging 2>&1 | tail -2 || true

      - name: dpkg check for CI_APT_PACKAGES
        run: |
          miss=""
          for p in python3 python3-pip python3-venv python3-dev git libnuma-dev libssl-dev \
                   pkg-config build-essential cmake rdma-core infiniband-diags perftest \
                   libibumad3 libibverbs-dev libibverbs1 ibverbs-providers ibverbs-utils \
                   libfabric-dev libnl-3-200 libnl-route-3-200 librdmacm1t64 ffmpeg \
                   libavcodec-dev libavformat-dev libavutil-dev libswscale-dev; do
            dpkg -l "$p" 2>/dev/null | grep -q "^ii" || miss="$miss $p"
          done
          echo "  missing:${miss:- none}"

      # UV_BREAK_SYSTEM_PACKAGES is set HERE rather than waiting for an image
      # rebuild. An env-var gap can be proven from the workflow, so the probe can
      # run the whole install now and reveal whatever lies BEYOND it -- the previous
      # probe run stopped at this exact wall and so learned nothing past it.
      - name: Run the real install script and record where it stops
        timeout-minutes: 35
        env:
          UV_BREAK_SYSTEM_PACKAGES: '1'
          PIP_BREAK_SYSTEM_PACKAGES: '1'
          # '1', not 'true': the script tests [ "$USE_VENV" = "1" ], so the stage's
          # current `USE_VENV: false` and a naive `true` are both just "not 1".
          #
          # This is the actual fix rather than chowning system directories. Upstream
          # defaults USE_VENV off because its runners are root; ours is uid 1001, and
          # the script's venv mode is fully wired -- the stage already sources
          # SGLANG_CI_VENV_PATH in its warmup steps and runs ci_cleanup_venv.sh at the
          # end. Installing into a uv venv needs no writable system site-packages and
          # no chown of root-owned paths.
          USE_VENV: '1'
        run: |
          # Patch the script in place to prove the next fix before committing it.
          # `uv venv --seed` installs ONLY pip on Python 3.12 -- verified locally --
          # so the venv has no setuptools or wheel, and human-eval (git-cloned at
          # line 766, legacy setup.py) dies on "invalid command 'bdist_wheel'".
          # USE_VENV=0 never showed this because the system Python carries Debian's
          # setuptools and wheel.
          sed -i 's|^\( *\)source "$UV_VENV/bin/activate"|\1source "$UV_VENV/bin/activate"\n\1uv pip install --quiet setuptools wheel|' scripts/ci/cuda/ci_install_dependency.sh
          grep -n -A1 'bin/activate"$' scripts/ci/cuda/ci_install_dependency.sh | head -4
          set -o pipefail
          set +e
          bash scripts/ci/cuda/ci_install_dependency.sh 2>&1 | tail -60
          # PIPESTATUS, not $?: piping to tail made the previous run report tail's
          # status and print a misleading "exit: 0" under a failed install.
          echo "  === install script exit: ${PIPESTATUS[0]} ==="
