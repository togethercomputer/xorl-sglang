name: PR Test Base
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Scheduled Full Run'
    || github.event_name == 'workflow_dispatch' && format('Manual run by {0}', github.actor)
    || github.event_name == 'pull_request' && format('PR #{0} - {1}', github.event.pull_request.number, github.event.pull_request.title)
    || 'PR Test Base'
  }}

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      force_continue_on_error:
        description: "Force continue-on-error (test scheduled CI behavior)"
        required: false
        type: boolean
        default: false
      test_parallel_dispatch:
        description: "Test parallel dispatch behavior (simulates scheduled run)"
        required: false
        type: boolean
        default: false
      run_all_tests:
        description: "Run all tests (mirrors the scheduled cron's behavior — combine with test_parallel_dispatch for full sim)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run all tests (for releasing or testing purpose)"
        required: false
        type: boolean
        default: false
      skip_pr_test_health_check:
        description: "Skip PR test health check fast-fail (e.g. for release branch cuts)"
        required: false
        type: boolean
        default: false

concurrency:
  # Concurrency group structure: pr-test-{event}-{branch}-{git_ref}
  # - event_name prevents scheduled runs from colliding with fork PRs whose branch is named 'main'
  #   (without it, both resolve the branch segment to 'main' and block each other)
  # - github.head_ref (pull_request) or github.ref_name (workflow_dispatch) normalizes to branch name
  group: pr-test-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}-${{ inputs.git_ref || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  SGLANG_IS_IN_CI: true
  SGLANG_CUDA_COREDUMP: "1"
  SGLANG_JIT_DEEPGEMM_FAST_WARMUP: true
  SKIP_PR_TEST_HEALTH_CHECK: ${{ (inputs.skip_pr_test_health_check == true || inputs.test_parallel_dispatch == true || inputs.run_all_tests == true) && 'true' || 'false' }}
  # Schedule / main-branch dispatch / workflow_call from main use refs/heads/main; PR events use refs/pull/*/merge
  PR_TEST_BYPASS_MAINTENANCE_ON_MAIN: ${{ github.ref == 'refs/heads/dev' && 'true' || 'false' }}
  USE_VENV: false

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  # =============================================== check changes ====================================================
  check-changes:
    uses: ./.github/workflows/_pr-test-check-changes.yml
    with:
      git_ref: ${{ inputs.git_ref || '' }}
      run_all_tests: ${{ inputs.run_all_tests == true }}
      force_continue_on_error: ${{ inputs.force_continue_on_error == true }}
    secrets: inherit

  # =============================================== Wait Jobs for Sequential PR Execution ====================================================
  # These jobs poll GitHub API to wait for previous stages to complete.
  # For PR runs: wait jobs run and enforce sequential execution via polling.
  # For scheduled runs: wait jobs are skipped, enabling parallel execution for easier retry.
  # For PRs with the `bypass-fastfail` label: wait jobs run but return success immediately
  # (handled inside the wait-for-jobs action), so downstream stages dispatch in parallel.

  wait-for-base-a:
    needs: [check-changes, call-gate]
    if: |
      always() &&
      !cancelled() &&
      needs.check-changes.result == 'success' &&
      github.event_name == 'pull_request' &&
      inputs.test_parallel_dispatch != true &&
      (needs.check-changes.outputs.main_package == 'true' || needs.check-changes.outputs.sgl_kernel == 'true') &&
      (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      base_a_result: ${{ steps.wait.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/check-maintenance

      - uses: ./.github/actions/wait-for-jobs
        id: wait
        with:
          stage-name: base-a
          jobs: |
            [
              {"prefix": "base-a-test-1-gpu-small", "expected_count": ${{ fromJson(needs.check-changes.outputs.partitions)['base-a-test-1-gpu-small'].size }}},
              {"prefix": "base-a-test-cpu", "expected_count": ${{ fromJson(needs.check-changes.outputs.partitions)['base-a-test-cpu'].size }}}
            ]
          max-wait-minutes: '240'

  wait-for-base-b:
    needs: [check-changes, call-gate, wait-for-base-a, rust-ext-build]
    if: |
      always() &&
      !cancelled() &&
      needs.check-changes.result == 'success' &&
      github.event_name == 'pull_request' &&
      inputs.test_parallel_dispatch != true &&
      (needs.check-changes.outputs.main_package == 'true' || needs.check-changes.outputs.sgl_kernel == 'true') &&
      (needs.wait-for-base-a.result == 'success' || needs.wait-for-base-a.result == 'skipped') &&
      (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      base_b_result: ${{ steps.wait.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/check-maintenance

      - uses: ./.github/actions/wait-for-jobs
        id: wait
        with:
          stage-name: base-b
          jobs: |
            [
              {"prefix": "base-b-test-1-gpu-small", "expected_count": ${{ fromJson(needs.check-changes.outputs.partitions)['base-b-test-1-gpu-small'].size }}},
              {"prefix": "base-b-test-1-gpu-large", "expected_count": ${{ fromJson(needs.check-changes.outputs.partitions)['base-b-test-1-gpu-large'].size }}},
              {"prefix": "base-b-test-2-gpu-large", "expected_count": ${{ fromJson(needs.check-changes.outputs.partitions)['base-b-test-2-gpu-large'].size }}}
            ]
          max-wait-minutes: '480'

  # =============================================== PR Gate ====================================================
  call-gate:
    needs: check-changes
    # Skip for scheduled runs (they run all tests)
    if: |
      github.event_name != 'schedule' &&
      inputs.test_parallel_dispatch != true &&
      (
        needs.check-changes.outputs.main_package == 'true' ||
        needs.check-changes.outputs.sgl_kernel == 'true' ||
        needs.check-changes.outputs.jit_kernel == 'true' ||
        needs.check-changes.outputs.multimodal_gen == 'true'
      )
    uses: ./.github/workflows/pr-gate.yml
    with:
      require-run-ci: false
    secrets: inherit

  # =============================================== Rust extensions ====================================================

  # Restored, and on a hosted runner. Deleting this moved the rust/ workspace compile
  # into every stage's install: measured at 290s of a 433s install, 67% of it, and
  # 290s x 28 GPU shards is about 2.25 GPU-hours per run. Compiling once here instead
  # lets every stage install with SGLANG_BUILD_RUST_EXTS=none.
  #
  # ubuntu-22.04, not the H100 scale set. Upstream compiles on a self-hosted build
  # node for two reasons that do not hold here: its persistent ~/.cache carried the
  # cargo target dir, which an ephemeral ARC pod cannot do anyway, and max_glibc 2.35
  # wanted an old image because upstream's pools span several. Every stage runner in
  # this fork is the same ubuntu-24.04 ARC image, and jammy's glibc 2.35 modules load
  # there. So this is free, never queues behind a GPU job, and keeps the GPU fleet for
  # tests.
  rust-ext-build:
    needs: [check-changes, call-gate]
    if: |
      !cancelled() &&
      needs.check-changes.result == 'success' &&
      (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    uses: ./.github/workflows/_pr-test-rust-ext-build.yml
    with:
      runs_on: ubuntu-22.04
      git_ref: ${{ inputs.git_ref || '' }}
      skip_pr_test_health_check: ${{ inputs.skip_pr_test_health_check == true }}
    secrets: inherit

  # =============================================== primary ====================================================

  # Runs on 5090 (32GB, SM120)
  base-a-test-1-gpu-small:
    needs: [check-changes, call-gate, rust-ext-build]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: base-a-test-1-gpu-small
      runner_config: 1-gpu-small
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      run_timeout_minutes: '10'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
    secrets: inherit

  base-a-test-cpu:
    needs: [check-changes, call-gate]
    if: |
      always() &&
      needs.check-changes.result == 'success' &&
      ((github.event_name == 'schedule' || inputs.test_parallel_dispatch == true) || (!failure() && !cancelled()))
    uses: ./.github/workflows/_pr-test-stage-cpu.yml
    with:
      self_name: base-a-test-cpu
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      run_timeout_minutes: '15'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
    # No `secrets: inherit`: this stage has no secret consumer, unlike the GPU
    # stages' coredump upload. GITHUB_TOKEN and permissions inherit regardless.

  # Runs on 5090 (32GB, SM120)
  base-b-test-1-gpu-small:
    needs: [check-changes, call-gate, wait-for-base-a, rust-ext-build]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: base-b-test-1-gpu-small
      runner_config: 1-gpu-small
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      # 16, not 50. Double duty: caps the Run test step AND drives the shard count,
      # since compute_partitions sizes each shard at 0.75 * timeout -- shrinking it
      # buys more shards, not shorter ones.
      #
      # 50 was tuned for the full 247-test suite, where 1-gpu-large held 222 est-min
      # and low fanout kept install overhead down. At 41 tests it holds 39.8, and 50
      # buys just 2 shards of 19.9 est -- ~23m, which was most of the pipeline. 16
      # gives 4 shards of 9.9 est, ~13m, keeping 4.3m of headroom against the worst
      # actual/est ratio observed here (1.18x: a 19.9-est shard that ran 23.4m).
      #
      # The cost is install, a fixed ~143s per shard: 4 shards spend ~9.5 GPU-min on
      # it against ~4.8 at 2 shards. That is GPU-seconds, not wall clock -- shards
      # install concurrently -- and 6 lane-GPU-minutes is worth 10 minutes of wall.
      run_timeout_minutes: '16'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
    secrets: inherit

  # Runs on H100 (80GB, SM90) - tests that don't pass on 5090 (FA3, FP8, high VRAM, etc.)
  base-b-test-1-gpu-large:
    needs: [check-changes, call-gate, wait-for-base-a, rust-ext-build]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: base-b-test-1-gpu-large
      runner_config: 1-gpu-large
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      # 16, not 50. Double duty: caps the Run test step AND drives the shard count,
      # since compute_partitions sizes each shard at 0.75 * timeout -- shrinking it
      # buys more shards, not shorter ones.
      #
      # 50 was tuned for the full 247-test suite, where 1-gpu-large held 222 est-min
      # and low fanout kept install overhead down. At 41 tests it holds 39.8, and 50
      # buys just 2 shards of 19.9 est -- ~23m, which was most of the pipeline. 16
      # gives 4 shards of 9.9 est, ~13m, keeping 4.3m of headroom against the worst
      # actual/est ratio observed here (1.18x: a 19.9-est shard that ran 23.4m).
      #
      # The cost is install, a fixed ~143s per shard: 4 shards spend ~9.5 GPU-min on
      # it against ~4.8 at 2 shards. That is GPU-seconds, not wall clock -- shards
      # install concurrently -- and 6 lane-GPU-minutes is worth 10 minutes of wall.
      run_timeout_minutes: '16'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
      timeout_per_file: '1800'
    secrets: inherit

  base-b-test-2-gpu-large:
    needs: [check-changes, call-gate, wait-for-base-a, rust-ext-build]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: base-b-test-2-gpu-large
      runner_config: 2-gpu-large
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      # 16, not 50. Double duty: caps the Run test step AND drives the shard count,
      # since compute_partitions sizes each shard at 0.75 * timeout -- shrinking it
      # buys more shards, not shorter ones.
      #
      # 50 was tuned for the full 247-test suite, where 1-gpu-large held 222 est-min
      # and low fanout kept install overhead down. At 41 tests it holds 39.8, and 50
      # buys just 2 shards of 19.9 est -- ~23m, which was most of the pipeline. 16
      # gives 4 shards of 9.9 est, ~13m, keeping 4.3m of headroom against the worst
      # actual/est ratio observed here (1.18x: a 19.9-est shard that ran 23.4m).
      #
      # The cost is install, a fixed ~143s per shard: 4 shards spend ~9.5 GPU-min on
      # it against ~4.8 at 2 shards. That is GPU-seconds, not wall clock -- shards
      # install concurrently -- and 6 lane-GPU-minutes is worth 10 minutes of wall.
      run_timeout_minutes: '16'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
    secrets: inherit

  base-b-test-1-gpu-b200:
    # First real (non-smoke) test on research-b200-ic1's
    # xorl-sglang-1-b200-gpu-runner (xorl-ci@9f0acbd). Held out of
    # pr-test-finish's needs at first landing since the runner had run exactly
    # one job ever at that point (a standalone import/nvidia-smi check); now
    # in that needs list after a manual dispatch (workflow_dispatch,
    # run_all_tests: true, since check-changes skips the GPU matrix for a
    # workflow-only diff) actually ran TestRadixCacheFCFS and
    # TestRadixCacheNonOverlapLPM end to end -- real server, real generate
    # requests -- and passed (`Ran 3 tests in 175.918s / OK (skipped=1)`).
    needs: [check-changes, call-gate, wait-for-base-a, rust-ext-build]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: base-b-test-1-gpu-b200
      runner_config: 1-gpu-b200
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      # One registered test (test/registered/radix_cache/test_radix_attention.py,
      # est_time=100) so far -- a single shard, no fanout to size for yet. 10
      # minutes gives headroom over the H100 lane's measured runtime for the
      # same test without masking a real hang.
      run_timeout_minutes: '10'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
    secrets: inherit

  base-c-test-4-gpu-h100:
    # wait-for-base-a, NOT wait-for-base-b: base-c runs concurrently with base-b
    # rather than after it. base-c is one serial shard of 4 files on the 4-GPU
    # scale set and was 21.6m of a 47m pipeline; overlapping it with base-b's 15m
    # takes the pipeline to ~26m without dropping a test.
    #
    # The fast-fail gate is kept, just moved up a stage: base-a is the cheap
    # sanity lane (4 files, ~10m), so a genuinely broken commit still stops here
    # before 4 GPUs are spent. What is given up is base-b as a gate -- base-c now
    # runs even when base-b fails, which under GPU contention burns 4 GPUs on a
    # run that is already red. That is the deliberate trade for the wall clock.
    needs: [check-changes, call-gate, wait-for-base-a, rust-ext-build]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: base-c-test-4-gpu-h100
      runner_config: 4-gpu-h100
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      # 20, not 50: 0.75 * 20 = 15 est-min per shard, so the 18.8 est-min suite
      # splits into 2 shards across the 4-GPU scale set's maxRunners: 2. LPT pairs
      # the 387s and 93s files against the 279s and 260s ones, so the longest shard
      # is ~8m of tests. Measured 1019s serial in run 32452576094.
      run_timeout_minutes: '20'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
      # Upstream warms both on lmsys/sglang-ci-dsv3-test, which is private to lmsys and
      # unreachable from this fork; the tests that needed it are disabled for the same
      # reason. Empty skips the steps -- _pr-test-stage.yml guards them on != ''.
      warmup_deep_gemm_models: ''
      warmup_server_models: ''
    secrets: inherit

  # ---------------------------------------------------------------------------
  # LoRA lanes. The `lora` test group runs on its own stage rather than inside
  # base-a/b/c so a LoRA failure fast-fails only LoRA, and so the group can be
  # dispatched on its own. Gated on wait-for-base-a (the cheap sanity lane) for
  # the same reason base-c is: a genuinely broken commit stops before GPUs are
  # spent. Nothing waits on these, so they never gate base-b or base-c.
  # ---------------------------------------------------------------------------
  lora-test-1-gpu-large:
    needs: [check-changes, call-gate, wait-for-base-a, rust-ext-build]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: lora-test-1-gpu-large
      runner_config: 1-gpu-large
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      run_timeout_minutes: '16'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
    secrets: inherit

  lora-test-4-gpu-h100:
    needs: [check-changes, call-gate, wait-for-base-a, rust-ext-build]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: lora-test-4-gpu-h100
      runner_config: 4-gpu-h100
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      run_timeout_minutes: '20'
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
      # Same reason as base-c-test-4-gpu-h100: the upstream warmup models live in
      # an lmsys-private repo this fork cannot reach. Empty skips the steps.
      warmup_deep_gemm_models: ''
      warmup_server_models: ''
    secrets: inherit

  # List every build and test job: `skipped` passes here, so an omission turns that
  # job's failure into a green run with no tests.
  pr-test-finish:
    needs:
      [
        call-gate,
        check-changes,

        rust-ext-build,

        wait-for-base-a,
        wait-for-base-b,

        base-a-test-1-gpu-small,
        base-a-test-cpu,
        base-b-test-1-gpu-small,
        base-b-test-1-gpu-large,
        base-b-test-2-gpu-large,
        base-b-test-1-gpu-b200,
        base-c-test-4-gpu-h100,

        lora-test-1-gpu-large,
        lora-test-4-gpu-h100,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          # Convert the 'needs' context to a JSON string
          json_needs='${{ toJson(needs) }}'

          # Get a list of all job names from the JSON keys
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')

          for job in $job_names; do
            # For each job, extract its result
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')

            # Print the job name and its result
            echo "$job: $result"

            # Check for failure or cancellation and exit if found
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done
          # If the loop completes, all jobs were successful
          echo "All jobs completed successfully"
          exit 0
