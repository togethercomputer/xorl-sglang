name: zz-cache-probe

# TEMPORARY diagnostic, delete before merge.
#
# Answers "is anything cached between jobs?" without mounting any new volume --
# the last attempt at that hung a pod in Init for 7.5 minutes.
on:
  push:
    branches: ['xorl/ci-h100-dev']
    paths: ['.github/workflows/zz-cache-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: xorl-sglang-1-h100-gpu-runner
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: What persists across jobs?
        run: |
          echo "-- marker test: did a previous job leave one on the hf-cache PVC? --"
          M=/mnt/hf-cache/.xorl-sglang-probe-marker
          if [ -f "$M" ]; then echo "  FOUND, written by: $(cat $M)"; else echo "  absent (this is the first probe, or the PVC does not persist)"; fi
          echo "run ${GITHUB_RUN_ID} at $(date -u +%FT%TZ)" > "$M" 2>/dev/null \
            && echo "  wrote a new marker" || echo "  COULD NOT WRITE - PVC not writable by $(id -un)"

          echo "-- is the uv cache anywhere persistent? --"
          echo "  UV_CACHE_DIR=${UV_CACHE_DIR:-<unset>}"
          echo "  uv cache dir resolves to: $(uv cache dir 2>/dev/null || echo n/a)"
          for d in /mnt/uv-cache "$HOME/.cache/uv"; do
            [ -d "$d" ] && echo "  $d exists, size $(du -sh $d 2>/dev/null | cut -f1), entries $(ls -1 $d 2>/dev/null | wc -l)" || echo "  $d absent"
          done

          echo "-- what IS on the shared PVC --"
          du -sh /mnt/hf-cache 2>/dev/null | sed 's/^/  total: /'
          ls /mnt/hf-cache 2>/dev/null | head -5 | sed 's/^/  /'
          echo "  cached model snapshots:"
          ls /mnt/hf-cache/hub 2>/dev/null | grep -c "^models--" | sed 's/^/    count: /'
          ls /mnt/hf-cache/hub 2>/dev/null | grep "^models--" | head -8 | sed 's/^/    /'

      - name: Is the gated model that base-b needs cached?
        run: |
          for m in models--meta-llama--Llama-2-7b-chat-hf models--meta-llama--Llama-3.1-8B-Instruct models--meta-llama--Llama-3.2-1B-Instruct; do
            if [ -d "/mnt/hf-cache/hub/$m" ]; then
              echo "  $m: CACHED ($(du -sh /mnt/hf-cache/hub/$m 2>/dev/null | cut -f1))"
            else
              echo "  $m: not cached"
            fi
          done

      - name: Cost of a cold uv install of one heavy wheel
        run: |
          uv venv /tmp/probe-v >/dev/null 2>&1
          S=$(date +%s)
          VIRTUAL_ENV=/tmp/probe-v uv pip install --quiet torch==2.13.0 --index-url https://download.pytorch.org/whl/cu130 2>&1 | tail -2
          echo "  torch install took $(( $(date +%s) - S ))s"
          echo "  uv cache after: $(du -sh $(uv cache dir 2>/dev/null) 2>/dev/null | cut -f1)"
