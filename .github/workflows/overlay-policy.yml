name: Overlay Policy Gate

# Enforces python/sglang/overrides/README.md ("Policy"): PRs to dev must not
# touch upstream-owned python/sglang/srt/** — a HARD FAIL by default. The only
# routes through: the `upstream-sync` label (verbatim upstream backport), or a
# maintainer-applied `srt-exception` label (write access required) combined
# with a drift-ledger update (python/sglang/overrides/UPSTREAM_DRIFT.md) in
# the same PR. A ledger edit alone no longer passes.
#
# Deliberately independent of pr-test.yml / pr-gate.yml: the policy gate must
# run on every PR, including drafts and PRs without the run-ci label. It uses
# the PR files API instead of a checkout, so it costs seconds.
# labeled/unlabeled are in the trigger list so adding or removing
# `upstream-sync` re-evaluates the gate without a push.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: overlay-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlay-policy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check srt/ changes against the overlay policy
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const GATED_PREFIX = 'python/sglang/srt/';
            const LEDGER = 'python/sglang/overrides/UPSTREAM_DRIFT.md';
            const SYNC_LABEL = 'upstream-sync';
            const EXCEPTION_LABEL = 'srt-exception';
            const POLICY_DOC = 'python/sglang/overrides/README.md';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = files.map((f) => f.filename);
            const srtChanges = paths.filter((p) => p.startsWith(GATED_PREFIX));

            if (srtChanges.length === 0) {
              core.info('No changes under ' + GATED_PREFIX + ' — policy gate passes.');
              return;
            }

            const labels = context.payload.pull_request.labels.map((l) => l.name);
            if (labels.includes(SYNC_LABEL)) {
              core.notice(
                'srt/ changes allowed: PR carries the `' + SYNC_LABEL + '` label ' +
                '(verbatim upstream sync/backport). Files: ' + srtChanges.join(', ')
              );
              return;
            }

            // srt/ is upstream-owned: changes are a HARD FAIL by default. The only
            // non-sync route through is a maintainer consciously applying the
            // exception label (write access required — the PR author cannot
            // self-serve past this gate by editing files) AND the drift ledger
            // being updated in the same PR.
            if (labels.includes(EXCEPTION_LABEL)) {
              if (!paths.includes(LEDGER)) {
                core.setFailed(
                  'PR carries `' + EXCEPTION_LABEL + '` but does not update the drift ' +
                  'ledger ' + LEDGER + '. Every excepted srt/ change must be recorded ' +
                  'there in the same PR. Files: ' + srtChanges.join(', ')
                );
                return;
              }
              core.warning(
                'srt/ changes allowed by maintainer exception (`' + EXCEPTION_LABEL +
                '` label) and recorded in ' + LEDGER + '. Reviewers: confirm each ' +
                'change fits an exception category in ' + POLICY_DOC + '. Files: ' +
                srtChanges.join(', ')
              );
              return;
            }

            core.setFailed(
              'This PR modifies upstream-owned ' + GATED_PREFIX + ' (' +
              srtChanges.join(', ') + ').\n\n' +
              'Fork changes do not go in srt/. Changed behavior of an upstream module ' +
              'belongs in an overlay twin under python/sglang/overrides/; brand-new ' +
              'capability belongs under python/sglang/xorl/ (see the Policy section of ' +
              POLICY_DOC + ').\n\n' +
              'If this srt/ change truly fits one of the narrow policy exceptions, a ' +
              'maintainer must apply the `' + EXCEPTION_LABEL + '` label AND the PR must ' +
              'add a row to ' + LEDGER + '. A verbatim upstream sync/backport takes the `' +
              SYNC_LABEL + '` label instead.'
            );
