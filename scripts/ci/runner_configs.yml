# Per-runner-config CUDA setup details. Single source of truth for the
# `runner_config` field on `register_cuda_ci(...)` calls. Consumed by
# scripts/ci/runner_configs.py (CLI wrapper), which is in turn called by
# .github/workflows/_pr-test-stage.yml.
#
# Each runner_config carries:
#   - install: install script path
#   - install_timeout: install-step wall-clock cap (minutes), enforced via
#     `timeout-minutes:` on the install step in _pr-test-stage.yml
#   - runs_on: GHA runner label for the stage's `runs-on:`. Every value names an
#     ARC scale set defined in togethercomputer/xorl-ci and registered against
#     this repository; upstream's 5090 / B200 / GB300 / H20 / H200 configs are
#     dropped because no such hardware backs this fork. runner_configs.py still
#     resolves the `$b200_runner` sentinel, which nothing here uses.
#   - rdma_devices (optional): exported as SGLANG_CI_RDMA_ALL_DEVICES env
#     to the stage job; absent means unset.

_anchors:
  default_install: &default scripts/ci/cuda/ci_install_dependency.sh

runner_configs:
  # 1-gpu-small is upstream's 5090 (32GB, SM120) lane. There is no 5090 here, so it
  # shares the 1-GPU H100 scale set with 1-gpu-large: the suite is sized to fit 32GB
  # and 80GB runs it fine. Keeping the config rather than deleting it preserves the
  # base-a fast-fail gate and the base-b small lane, and keeps the suite names in
  # test/registered/ matching upstream so a merge does not have to rewrite them.
  1-gpu-small:       { install: *default, install_timeout: "20", runs_on: xorl-sglang-1-h100-gpu-runner }
  1-gpu-large:       { install: *default, install_timeout: "20", runs_on: xorl-sglang-1-h100-gpu-runner }
  2-gpu-large:       { install: *default, install_timeout: "20", runs_on: xorl-sglang-2-h100-gpu-runner }
  4-gpu-h100:        { install: *default, install_timeout: "20", runs_on: xorl-sglang-4-h100-gpu-runner }
