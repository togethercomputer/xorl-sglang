# Per-runner-config CUDA setup details. Single source of truth for the
# `runner_config` field on `register_cuda_ci(...)` calls. Consumed by
# scripts/ci/runner_configs.py (CLI wrapper), which is in turn called by
# .github/workflows/_pr-test-stage.yml.
#
# Each runner_config carries:
#   - install: install script path
#   - artifact_version: actions/download-artifact major version
#   - install_timeout: install-step wall-clock cap (minutes), enforced via
#     `timeout-minutes:` on the install step in _pr-test-stage.yml
#   - grace_blackwell (optional): exported as GRACE_BLACKWELL for the install
#     step. Used by GB300 DeePEP setup.
#   - runs_on: GHA runner label for the stage's `runs-on:`. The literal
#     `$b200_runner` is substituted at workflow-load time with the dynamic
#     b200 runner tag from check-changes (see runner_configs.py --map).
#   - rdma_devices (optional): exported as SGLANG_CI_RDMA_ALL_DEVICES env
#     to the stage job; absent means unset.

_anchors:
  default_install: &default scripts/ci/cuda/ci_install_dependency.sh
  deepep_install:  &deepep  scripts/ci/cuda/ci_install_deepep.sh
  kimi_k3_install: &kimi_k3 scripts/ci/cuda/ci_install_kimi_k3.sh

runner_configs:
  # Every value names an ARC scale set defined in togethercomputer/xorl-ci and
  # registered against this repository. Upstream's 5090 / B200 / GB300 / H20 / H200
  # configs are dropped because no such hardware backs this fork; runner_configs.py
  # still resolves the `$b200_runner` sentinel, which nothing here uses.
  #
  # artifact_version is KEPT, unlike on upstream main which dropped the field:
  # v0.5.17's _pr-test-stage.yml gates its sgl-kernel wheel download on
  # `steps.rc.outputs.artifact_version == 'v4'` / `'v6'`, so omitting it silently
  # skips that download. All four are v4 -- v6 was upstream's Blackwell lane.
  #
  # 1-gpu-small is upstream's 5090 (32GB, SM120) lane. There is no 5090 here, so it
  # shares the 1-GPU H100 scale set with 1-gpu-large: the suite is sized to fit 32GB
  # and 80GB runs it fine. Keeping the config rather than deleting it preserves the
  # base-a fast-fail gate and the base-b small lane, and keeps the suite names in
  # test/registered/ matching upstream so a merge does not have to rewrite them.
  1-gpu-small:       { install: *default, artifact_version: v4, install_timeout: "20", runs_on: xorl-sglang-1-h100-gpu-runner }
  1-gpu-large:       { install: *default, artifact_version: v4, install_timeout: "20", runs_on: xorl-sglang-1-h100-gpu-runner }
  2-gpu-large:       { install: *default, artifact_version: v4, install_timeout: "20", runs_on: xorl-sglang-2-h100-gpu-runner }
  4-gpu-h100:        { install: *default, artifact_version: v4, install_timeout: "20", runs_on: xorl-sglang-4-h100-gpu-runner }
  # New, unlike the four above: xorl-sglang-1-b200-gpu-runner (research-b200-ic1,
  # togethercomputer/xorl-ci@9f0acbd) has run exactly one job before this -- a
  # standalone smoke check (import + nvidia-smi), not a real registered test. Kept
  # as its own runner_config rather than folded into 1-gpu-small/1-gpu-large: those
  # names are upstream's, keyed to specific H100/5090 hardware assumptions in
  # test/registered/, and this is a different cluster with its own unproven
  # failure modes (see xorl-ci's README on research-b200-ic1's two ARC controllers).
  1-gpu-b200:        { install: *default, artifact_version: v4, install_timeout: "20", runs_on: xorl-sglang-1-b200-gpu-runner }
